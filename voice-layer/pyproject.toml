[project]
name = "voice-layer"
version = "0.1.0"
description = "Jarvis Voice Layer: Wake-word, STT, TTS, and VAD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "pynput>=1.7.6",
    "soundfile>=0.12.1",
    "scipy>=1.11.0",
    "websockets>=12.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
